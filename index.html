<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unmade Game - Offline Local Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="game-wrapper">
        <header id="game-header">
            <h1>UNMADE GAME</h1>
            <p>Static Grid Mode (HTML Configured)</p>
        </header>

        <!-- CORE GAME BOARD: Put all your card slots manually right here -->
        <section id="game-board">
            
            <div class="card-slot" data-slot-id="1" data-card-id="card_fire_01" data-rarity="rare">
                <span class="slot-label">Slot 1</span>
            </div>

            <div class="card-slot" data-slot-id="2" data-card-id="card_water_03" data-rarity="common">
                <span class="slot-label">Slot 2</span>
            </div>

            <div class="card-slot" data-slot-id="3" data-card-id="card_earth_07" data-rarity="epic">
                <span class="slot-label">Slot 3</span>
            </div>

            <div class="card-slot" data-slot-id="4" data-card-id="empty" data-rarity="none">
                <span class="slot-label">Slot 4 (Empty)</span>
            </div>

        </section>
    </main>

    <!-- Connect your engine -->
    <script src="game.js"></script>
</body>
</html>
