&lt;title&gt;Game Start UI&lt;/title&gt;

&lt;style&gt;
body {
  margin: 0;
  height: 100vh;
  background: #ffd84d;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}

/* MENU */
.container {
  text-align: center;
}

.btn {
  width: 320px;
  max-width: 90%;
  padding: 18px;
  border-radius: 20px;
  font-size: 18px;
  font-weight: bold;
  border: none;
  cursor: pointer;
  margin: 15px 0;
}

.play-btn {
  background: linear-gradient(45deg,#5f3bff,#7a5cff);
  color: white;
}

.secondary-btn {
  background: #fff3b0;
  color: #5f3bff;
}

/* GAME AREA */
.game-wrapper {
  position: fixed;
  inset: 0;
  display: none;
  background: black;
  overflow: hidden;
}

/* RESPONSIVE IFRAME */
.game-wrapper iframe {
  width: 100vw;
  height: 100vh;
  border: none;
  display: block;
}

/* MOBILE FIXES */
@media (max-width: 768px) {
  .btn {
    font-size: 16px;
    padding: 16px;
  }
}
&lt;/style&gt;
&lt;/head&gt;

&lt;div class=&quot;container&quot; id=&quot;menu&quot;&gt;
  &lt;button class=&quot;btn play-btn&quot; onclick=&quot;startGame()&quot;&gt;PLAY GAME&lt;/button&gt;

&lt;/div&gt;

&lt;script&gt;

/* PLAY GAME */
function startGame() {
